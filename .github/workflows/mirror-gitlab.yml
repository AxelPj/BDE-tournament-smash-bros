# Recopie les pushs sur la branche main de GitHub vers GitLab, ce qui déclenche
# la pipeline .gitlab-ci.yml (lint -> tests -> build -> déploiement VPS).
# Les autres branches et les tags restent uniquement sur GitHub.
#
# À configurer dans GitHub (Settings > Secrets and variables > Actions) :
#   Secret   GITLAB_TOKEN : token d'accès personnel GitLab (fine-grained), permission Repository > Code : Push
#   Variable GITLAB_REPO  : chemin du dépôt sans https://, ex : gitlab.com/42perpignanBDE/BDE-tournament-smash-bros.git

name: Miroir vers GitLab

on:
  push:
    branches: [main]

# Un seul miroir à la fois, dans l'ordre des pushs
concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push sur GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
        run: |
          # Retire espaces / retours à la ligne collés par erreur, et un éventuel https://
          GITLAB_TOKEN="$(printf '%s' "$GITLAB_TOKEN" | tr -d '[:space:]')"
          GITLAB_REPO="$(printf '%s' "$GITLAB_REPO" | tr -d '[:space:]')"
          GITLAB_REPO="${GITLAB_REPO#https://}"
          if [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_REPO" ]; then
            echo "::error::GITLAB_TOKEN (secret) ou GITLAB_REPO (variable) non configuré"
            exit 1
          fi
          echo "Push de main vers https://${GITLAB_REPO}"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"
          git push gitlab "HEAD:refs/heads/main"
