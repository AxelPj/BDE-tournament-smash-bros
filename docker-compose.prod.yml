# Production : images figées (pas de volume de code), front compilé, backend sans --reload.
# Le HTTPS est géré par le Caddy déjà installé sur le VPS, qui relaie vers nginx (127.0.0.1:5003).
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  backend:
    container_name: smash-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/smash.db
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - smash_net

  frontend:
    container_name: smash-frontend
    build:
      context: ./smash-bros
      dockerfile: Dockerfile
      target: production
      args:
        BACKEND_ORIGIN: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smash_net

  nginx:
    container_name: smash-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    # Exposé uniquement en local : le Caddy du VPS (hors Docker) gère le HTTPS
    # et relaie smash.bde42perpignan.fr vers 127.0.0.1:5003
    ports:
      - "127.0.0.1:5003:80"
    networks:
      - smash_net

volumes:
  sqlite_data:

networks:
  smash_net:
    driver: bridge
