# Ne pas annoncer la version de nginx dans les réponses ni les pages d'erreur.
server_tokens off;

# Derrière le Caddy du VPS (prod) : l'IP réelle du client vient de X-Forwarded-For,
# accepté uniquement depuis les réseaux privés Docker (le trafic publié sur
# 127.0.0.1:5003 arrive depuis la passerelle Docker, en 172.16.0.0/12).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Conserve le X-Forwarded-Proto (https) posé par le Caddy du VPS, sinon le schéma de nginx
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Rate limiting par adresse IP sur les routes d'authentification OAuth
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/m;
limit_req_status 429;

# WebSocket connection upgrade mapping (HMR Next.js)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# DÉFINITION DES UPSTREAMS (Les conteneurs Docker)
upstream backend_api {
    server backend:8000;
}

upstream frontend_dev {
    server frontend:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    proxy_hide_header X-Powered-By;

    # Rate limiting sur l'authentification OAuth 42
    location ~ ^/api/auth/oauth/ {
        limit_req zone=auth_ip burst=5 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Toutes les routes /api/* vont directement vers FastAPI
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Compression gzip limitée aux assets statiques de Next.js
    location /_next/static/ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Images et vidéo de public/ : Next les sert avec max-age=0, ce qui force une
    # revalidation (304) de chaque vignette à chaque ouverture. Cache navigateur 7 jours.
    # `expires` n'utilise pas add_header : les en-têtes de sécurité restent hérités.
    location ~* ^/(?:(?:fighters|items|smash)/.+\.(?:webp|png|jpe?g|gif|svg)|smash-video\.(?:mp4|webm)|mario-coin\.svg)$ {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Cache-Control;
        expires 7d;
    }

    # Frontend Next.js + WebSockets HMR
    location / {
        proxy_pass http://frontend_dev;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }
}
