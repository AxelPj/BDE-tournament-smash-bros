# Pipeline CI/CD : lint -> tests -> build -> déploiement sur le VPS
#
# Variables à définir dans GitLab (Settings > CI/CD > Variables) :
#   SSH_PRIVATE_KEY   (File ou Variable, masquée/protégée) : clé privée autorisée sur le VPS
#   VPS_IP            : adresse du VPS
#   VPS_USER            : utilisateur SSH
#   VPS_PROJECT_PATH  : chemin du dépôt cloné sur le VPS, ex : /opt/smash-bros
#   VPS_SSH_PORT      : (optionnel) port SSH, 22 par défaut
#   SSH_KNOWN_HOSTS   : (optionnel, recommandé) sortie de `ssh-keyscan <VPS_IP>`,
#                       sinon la clé de l'hôte est récupérée à la volée
#
# Sur le VPS (une seule fois) : cloner le dépôt dans VPS_PROJECT_PATH, puis créer
#   backend/.env  (secrets OAuth 42, cf. backend/.env.example)
# smash.bde42perpignan.fr vers nginx sur 127.0.0.1:5003.

stages:
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/backend/.venv"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# --------------------------------------------------------------------------
# Modèles communs
# --------------------------------------------------------------------------

.backend:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - cd backend
    - uv sync --frozen --group dev
  cache:
    key:
      files: [backend/uv.lock]
      prefix: backend
    paths: [.cache/uv]

.frontend:
  image: node:22-alpine
  before_script:
    - cd smash-bros
    - npm ci --prefer-offline --no-audit --no-fund
  cache:
    key:
      files: [smash-bros/package-lock.json]
      prefix: frontend
    paths: [.cache/npm]

# --------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------

backend_lint:
  extends: .backend
  stage: lint
  script:
    # Erreurs bloquantes uniquement : syntaxe, noms non définis, etc.
    - uvx ruff check --isolated --select E9,F63,F7,F82 .
    # Rapport complet, informatif (ne fait pas échouer le job)
    - uvx ruff check --isolated --exit-zero --statistics .

frontend_lint:
  extends: .frontend
  stage: lint
  script:
    - npm run lint

frontend_typecheck:
  extends: .frontend
  stage: lint
  script:
    # next typegen génère les types globaux (LayoutProps, PageProps...) absents d'un clone neuf
    - npm run typecheck

compose_config:
  stage: lint
  image: docker:27-cli
  script:
    - cp backend/.env.example backend/.env
    - docker compose config --quiet
    - docker compose -f docker-compose.prod.yml config --quiet

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------

backend_tests:
  extends: .backend
  stage: test
  needs: []
  variables:
    DATABASE_URL: "sqlite:///./ci-test.db"
  script:
    - uv run --with pytest-cov pytest
        --junitxml=report.xml
        --cov=app --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

backend_migrations:
  extends: .backend
  stage: test
  needs: []
  variables:
    DATABASE_URL: "sqlite:///./ci-migrations.db"
  script:
    # Base vierge -> head -> retour à zéro -> head : les migrations doivent être réversibles
    - uv run alembic upgrade head
    - uv run alembic downgrade base
    - uv run alembic upgrade head
    - uv run python -m app.cli seed-shop

# --------------------------------------------------------------------------
# Build
# --------------------------------------------------------------------------

frontend_build:
  extends: .frontend
  stage: build
  script:
    - npm run build

docker_build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - cp backend/.env.example backend/.env
    - docker compose -f docker-compose.prod.yml build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/Dockerfile"
        - docker-compose.yml
        - docker-compose.prod.yml
        - nginx/**/*
        - backend/pyproject.toml
        - backend/uv.lock
        - smash-bros/package*.json

# --------------------------------------------------------------------------
# Déploiement sur le VPS (branche par défaut uniquement)
# --------------------------------------------------------------------------

deploy_to_vps:
  stage: deploy
  image: alpine:3.20
  resource_group: production
  environment:
    name: production
  before_script:
    # Retire espaces / retours à la ligne collés par erreur dans les variables GitLab
    - |
      for v in VPS_USER VPS_IP VPS_SSH_PORT VPS_PROJECT_PATH; do
        eval "export $v=\"\$(printf '%s' \"\${$v}\" | tr -d '[:space:]')\""
      done
      echo "VPS_USER : ${#VPS_USER} caractères, port : ${VPS_SSH_PORT:-22}, chemin : $VPS_PROJECT_PATH"
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # Accepte SSH_PRIVATE_KEY de type "File" (chemin) ou "Variable" (contenu)
    - if [ -f "$SSH_PRIVATE_KEY" ]; then KEY="$(cat "$SSH_PRIVATE_KEY")"; else KEY="$SSH_PRIVATE_KEY"; fi
    - echo "$KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_IP" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Mise à jour du dépôt sur $VPS_IP..."
    - |
      ssh -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_IP" \
        "PROJECT_PATH=$VPS_PROJECT_PATH sh -s" << 'EOF'
        set -eu
        cd "$PROJECT_PATH"
        git pull
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
